services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poultry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: poultry_market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poultry -d poultry_market"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://poultry:${POSTGRES_PASSWORD}@db:5432/poultry_market"
      DATABASE_SYNC_URL: "postgresql+psycopg2://poultry:${POSTGRES_PASSWORD}@db:5432/poultry_market"
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "https://api.poultrymarketintel.com/api/v1"
    depends_on:
      - backend

  ai-engine:
    build: ./ai-engine
    environment:
      DATABASE_URL: "postgresql+psycopg2://poultry:${POSTGRES_PASSWORD}@db:5432/poultry_market"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
